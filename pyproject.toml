[project]
name = "openhasp-config-manager"
version = "0.9.0"
description = "A tool to manage all of your openHASP device configs in a centralized place."
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Markus Ressel", email = "mail@markusressel.de" }]
keywords = ["openhasp", "config", "management", "mqtt", "home automation", "appdaemon"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
]

dependencies = [
    "click>=8.4.2",
    "requests>=2.32.5",
    "aiohttp>=3.9.0",
    "temppathlib>=1.2.0",
    "Jinja2>=3.1.6",
    "py-range-parse>=1.0.6",
    "pyyaml>=6.0.3",
    "multidict>=6.7.1",
    "frozenlist>=1.8.0",
    "yarl>=1.24.2",
    "orjson>=3.11.9",
    "aiomqtt", # compromise to get it working with appdaemon 4.5.0
    "paho-mqtt>=1.6.1,<2.2.0",
    "telnetlib3>=4.0.5",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# the editor: `openhasp-config-manager gui`
# (openhasp_config_manager.ad runs inside AppDaemon and openhasp_config_manager.haad inside haad: install them yourself, they pin
# versions of aiohttp and others that must not apply to everybody)
gui = ["PyQt6>=6.11.0", "QtAwesome>=1.4.2", "qt-themes>=0.4.0", "pfzy>=0.3.4", "watchdog>=6.0.0", "segno>=1.6.6"]

[project.scripts]
openhasp-config-manager = "openhasp_config_manager.cli:cli"

[project.urls]
homepage = "https://github.com/markusressel/openhasp-config-manager"
repository = "https://github.com/markusressel/openhasp-config-manager"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "openhasp_config_manager" },
]

[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = "*"
pytest_asyncio = "*"
pytest-cov = "^7.1.0"

[tool.ruff]
# Same as Black.
line-length = 127
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (F) and Error (E) codes (similar to your flake8 setup)
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

# This ensures Ruff doesn't go diving into your venv
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
